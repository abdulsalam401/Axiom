[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-android"
version = "2.1.0"
description = "Advanced Android Security Assessment Framework (Matrix Cyber HUD Edition)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Abdul Salam", email = "contact@salamcs.app" }
]
keywords = [
    "android", "security", "pentesting", "adb", "vulnerability-scanner",
    "apk-analyzer", "exploit", "bluez", "cybersecurity", "terminal-ui"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "rich>=13.0.0",
    "requests>=2.31.0",
    "colorama>=0.4.6",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
bluetooth = ["bleak>=0.21.0"]
full = [
    "bleak>=0.21.0",
    "frida-tools>=12.0.0",
]

[project.urls]
Homepage = "https://salamcs.app"
Repository = "https://github.com/abdulsalam401/Axiom"
Issues = "https://github.com/abdulsalam401/Axiom/issues"

[project.scripts]
axiom = "axiom:main"

[tool.setuptools]
packages = ["modules"]
py-modules = ["axiom", "bt_scanner"]
